[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-generation"
version = "0.1.0"
description = "Claude writes pytest tests from task-card acceptance criteria; a gate keeps only the tests that fail against a seeded bug."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mike Danifo" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
taskgen = "taskgen.cli:main"

[project.urls]
Homepage = "https://danifo.dev"

[tool.setuptools.packages.find]
include = ["frontdesk*", "harness*", "taskgen*"]

[tool.pytest.ini_options]
# harness.conftest is the pytest plugin every test here (and every generated test) runs on.
addopts = "-ra --strict-markers --import-mode=importlib -p harness.conftest"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
markers = [
    "criterion(id): the acceptance criterion a test checks, written FERN-<n>/AC-<k>",
    "catches(*names): this reference-suite test is meant to fail when any of the named seeded bugs is active",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# proposed/ is gate output. tests/generated/ keeps accepted tests byte for byte as the
# gate ran them; tests/taskgen/test_generated_suite.py holds them to the static checks.
extend-exclude = ["proposed", "tests/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["frontdesk", "harness", "taskgen", "tests"]
